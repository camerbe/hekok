name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

# ─────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────
jobs:

  # ── 1. SETUP & CACHE ──────────────────────
  setup:
    name: 📦 Install & Cache
    runs-on: ubuntu-latest
    outputs:
      nx-base: ${{ steps.nx-base.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Nx needs full git history for affected detection

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Derive Nx base SHA (affected)
        id: nx-base
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "base=HEAD~1" >> $GITHUB_OUTPUT
          fi

  # ── 2. LINT ───────────────────────────────
  lint:
    name: 🔍 Lint (affected)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline

      - name: Lint affected projects
        run: |
          npx nx affected \
            --target=lint \
            --base=${{ needs.setup.outputs.nx-base }} \
            --parallel=3

  # ── 3. TYPE-CHECK ─────────────────────────
  typecheck:
    name: 🧩 Type-check (affected)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline

      - name: Type-check affected projects
        run: |
          npx nx affected \
            --target=type-check \
            --base=${{ needs.setup.outputs.nx-base }} \
            --parallel=3

  # ── 4. UNIT TESTS ─────────────────────────
  test:
    name: 🧪 Unit Tests (affected)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline

      - name: Run unit tests (affected)
        run: |
          npx nx affected \
            --target=test \
            --base=${{ needs.setup.outputs.nx-base }} \
            --parallel=2 \
            --code-coverage \
            --ci

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── 5. BUILD ──────────────────────────────
  build:
    name: 🏗️ Build (affected)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline

      - name: Build affected projects
        run: |
          npx nx affected \
            --target=build \
            --base=${{ needs.setup.outputs.nx-base }} \
            --parallel=2 \
            --configuration=production

      - name: Upload backoffice dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-backoffice
          path: dist/apps/backoffice/
          retention-days: 3

      - name: Upload frontoffice dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-frontoffice
          path: dist/apps/frontoffice/
          retention-days: 3

  # ── 6. DEPENDENCY GRAPH CHECK ─────────────
  dep-graph:
    name: 📐 Dependency Constraints
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline

      - name: Enforce Nx dep constraints (ESLint)
        # Validates @nx/enforce-module-boundaries rules from .eslintrc.json
        run: |
          npx nx run-many \
            --target=lint \
            --projects=tag:type:app \
            --parallel=2

  # ── 7. DEPLOY backoffice (main only) ──────
  deploy-backoffice:
    name: 🚀 Deploy Backoffice
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-backoffice
      url: https://admin.my-platform.com
    steps:
      - uses: actions/checkout@v4

      - name: Download backoffice dist
        uses: actions/download-artifact@v4
        with:
          name: dist-backoffice
          path: dist/apps/backoffice

      # ── Replace with your own deploy step ──
      # e.g. Firebase, Vercel, S3+CloudFront, Azure Static Web Apps…
      - name: Deploy to hosting (example)
        run: |
          echo "👉 Replace this step with your actual deploy command"
          echo "   e.g: firebase deploy --only hosting:backoffice"
        env:
          DEPLOY_TOKEN: ${{ secrets.BACKOFFICE_DEPLOY_TOKEN }}

  # ── 8. DEPLOY frontoffice (main only) ─────
  deploy-frontoffice:
    name: 🚀 Deploy Frontoffice
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-frontoffice
      url: https://my-platform.com
    steps:
      - uses: actions/checkout@v4

      - name: Download frontoffice dist
        uses: actions/download-artifact@v4
        with:
          name: dist-frontoffice
          path: dist/apps/frontoffice

      - name: Deploy to hosting (example)
        run: |
          echo "👉 Replace this step with your actual deploy command"
          echo "   e.g: firebase deploy --only hosting:frontoffice"
        env:
          DEPLOY_TOKEN: ${{ secrets.FRONTOFFICE_DEPLOY_TOKEN }}
